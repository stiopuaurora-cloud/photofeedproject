<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Feed</title>
     <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>Photo Feed</h1>
    </div>
    <div class="photo-feed">
        <div class="photo-item">
            <div class="photo-header">
                <h2>Photo with my bff</h2>
                <span>12/12</span>
            </div>
            <img src="minions.jpg" alt="dos minions riendo">
            <p>Este es un momento muy especial con mi mejor amiga.</p>
        </div>
        <div class="photo-item">
            <div class="photo-header">
                <h2>My pet</h2>
                <span>20/12</span>
            </div>
            <img src="perrito.jpg" alt="primer plano de un perrito">
            <p> Este es el nuevo perrito de mi familia.</p>
        </div>
        <div class="photo-item">
            <div class="photo-header">
                <h2>A cute butterfly</h2>
                <span>22/12</span>
            </div>
            <img src= "mariposa.jpg" alt="mariposa posada en una flor">
            <p>Esta es una mariposa muy bonita que vi en el jardín.</p>
        </div>
    </div>
</body>
</html>
